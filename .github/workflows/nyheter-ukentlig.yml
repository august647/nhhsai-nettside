name: Ukentlig nyhetsutgave

# Hovedjobben er den planlagte oppgaven i Claude (natt til lørdag kl. 01.48 norsk tid).
# Denne jobben er reserveløsning og manuell knapp. Den kjører lørdag kl. 04.00 UTC (06.00 sommertid,
# 05.00 vintertid) og gjør ingenting hvis uka allerede er publisert.
#
# Innlogging. Med «auto» brukes den første som finnes:
#   1. Abonnement: secret CLAUDE_CODE_OAUTH_TOKEN (lages med «claude setup-token»).
#      Claude Code kjører utgaven og bruker Claude Pro-abonnementet ditt.
#   2. API: secret ANTHROPIC_API_KEY. verktoy/nyheter_agenter.mjs kjører utgaven og belaster API-kontoen.
# Du kan tvinge ett av dem med knappen «Run workflow», eller med repo-variabelen NYHETER_METODE
# (abonnement eller api). Modellen for abonnement kan byttes med repo-variabelen NYHETER_MODELL.
#
# Manuell kjøring: Actions, «Ukentlig nyhetsutgave», Run workflow. Tørrkjøring er på som standard
# og publiserer ingenting. Fjern haken for å publisere.
#
# Bruksgrenser (abonnement). Utgaven kan bruke mer enn ett fem-timersvindu. Derfor:
#   - Claude skriver mellomresultater til arbeid/, og jobben lagrer dem på grenen «arbeid» (mappe per uke),
#     også når Claude stoppes. Neste kjøring av samme uke henter dem og fortsetter. «Frisk start» hopper over dette.
#   - verktoy/bruksvokter.py stopper Claude når grensen er nådd, når ukebruken når UKEGRENSE
#     (repo-variabelen NYHETER_UKEGRENSE, standard 0.95 = 95 %), eller etter MAKS_MINUTTER.

on:
  schedule:
    - cron: '0 4 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Tørrkjøring: lag utgaven, men ikke publiser'
        type: boolean
        default: true
      metode:
        description: 'Innlogging: auto velger abonnement hvis token finnes, ellers API-nøkkel'
        type: choice
        options:
          - auto
          - abonnement
          - api
        default: auto
      dato:
        description: 'Dato utgaven lages for (ÅÅÅÅ-MM-DD). La stå tom for i dag.'
        type: string
        required: false
      overskriv:
        description: 'Lag utgaven på nytt selv om uka allerede finnes'
        type: boolean
        default: false
      frisk_start:
        description: 'Frisk start: ikke bruk lagret arbeid fra en tidligere kjøring av samme uke'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nyheter-ukentlig
  cancel-in-progress: false

jobs:
  utgave:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODEL: claude-opus-5-5
      MAX_COST_USD: '30'
      CONCURRENCY: '4'
      # Abonnement: Claude stoppes av seg selv når ukebruken når denne grensen (0 til 1), eller etter så mange minutter.
      UKEGRENSE: ${{ vars.NYHETER_UKEGRENSE || '0.95' }}
      MAKS_MINUTTER: '150'
      FRISK_START: ${{ github.event_name == 'workflow_dispatch' && inputs.frisk_start && 'true' || 'false' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      DATO: ${{ github.event_name == 'workflow_dispatch' && inputs.dato || '' }}
      OVERSKRIV: ${{ github.event_name == 'workflow_dispatch' && inputs.overskriv && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Finn uka
        id: uke
        run: |
          IDAG="$DATO"
          if [ -z "$IDAG" ]; then IDAG=$(TZ=Europe/Oslo date +%F); fi
          python3 verktoy/nyheter_verktoy.py neste-uke "$IDAG" --ut args.json
          python3 verktoy/nyheter_verktoy.py sjekk
          FINNES=$(python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, 'verktoy')
          import nyheter_verktoy as v
          a = json.load(open('args.json', encoding='utf-8-sig'))
          d = v.les()
          print('true' if any((w['uke'], w['aar']) == (a['uke'], a['aar']) for w in d['uker']) else 'false')
          EOF
          )
          echo "finnes=$FINNES" >> "$GITHUB_OUTPUT"
          MAPPE=$(python3 -c "import json; a=json.load(open('args.json', encoding='utf-8-sig')); print('uke-%s-%s' % (a['uke'], a['aar']))")
          echo "mappe=$MAPPE" >> "$GITHUB_OUTPUT"
          echo "Uke $(python3 -c "import json; a=json.load(open('args.json', encoding='utf-8-sig')); print(a['uke'], a['aar'])"), finnes allerede: $FINNES"

      - name: Hopp over hvis uka allerede er publisert
        if: steps.uke.outputs.finnes == 'true' && env.OVERSKRIV != 'true'
        run: |
          echo "Uka finnes allerede i public/nyheter-data.js. Ingenting å gjøre." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Velg innlogging
        id: metode
        if: steps.uke.outputs.finnes != 'true' || env.OVERSKRIV == 'true'
        env:
          HAR_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'ja' || 'nei' }}
          HAR_NOKKEL: ${{ secrets.ANTHROPIC_API_KEY != '' && 'ja' || 'nei' }}
          VALGT: ${{ inputs.metode || vars.NYHETER_METODE || 'auto' }}
        run: |
          case "$VALGT" in
            abonnement) M=abonnement ;;
            api) M=api ;;
            *)
              if [ "$HAR_TOKEN" = ja ]; then M=abonnement
              elif [ "$HAR_NOKKEL" = ja ]; then M=api
              else M=ingen
              fi ;;
          esac
          if [ "$M" = ingen ]; then
            echo "::error::Uka mangler, men ingen innlogging er satt opp. Legg inn secret CLAUDE_CODE_OAUTH_TOKEN (abonnement) eller ANTHROPIC_API_KEY (API) under Settings, Secrets and variables, Actions."
            exit 1
          fi
          if [ "$M" = abonnement ] && [ "$HAR_TOKEN" != ja ]; then
            echo "::error::Abonnement er valgt, men secret CLAUDE_CODE_OAUTH_TOKEN mangler."
            exit 1
          fi
          if [ "$M" = api ] && [ "$HAR_NOKKEL" != ja ]; then
            echo "::error::API er valgt, men secret ANTHROPIC_API_KEY mangler."
            exit 1
          fi
          echo "metode=$M" >> "$GITHUB_OUTPUT"
          echo "Innlogging: $M" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Installer Claude Code
        if: steps.metode.outputs.metode == 'abonnement'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Sjekk token
        if: steps.metode.outputs.metode == 'abonnement'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Skriver bare ut form og lengde, aldri selve tokenet.
          T="$CLAUDE_CODE_OAUTH_TOKEN"
          echo "Token: lengde ${#T} tegn, linjer: $(printf '%s' "$T" | wc -l)"
          case "$T" in
            sk-ant-oat01-*) echo "Starter med sk-ant-oat01-" ;;
            *) echo "::warning::Tokenet starter ikke med sk-ant-oat01-, som er vanlig for tokens fra claude setup-token." ;;
          esac
          if printf '%s' "$T" | grep -q '[[:space:]]'; then
            echo "::error::Tokenet inneholder mellomrom eller linjeskift. Lim det inn på nytt uten noe rundt."
            exit 1
          fi
          if printf '%s' "$T" | grep -q '[^A-Za-z0-9_-]'; then
            echo "::warning::Tokenet inneholder tegn som vanligvis ikke er med i et token (for eksempel anførselstegn eller likhetstegn)."
          fi

      - name: Hent lagret arbeid fra forrige kjøring
        if: steps.metode.outputs.metode == 'abonnement'
        env:
          MAPPE: ${{ steps.uke.outputs.mappe }}
        run: |
          # Arbeidsfilene ligger på grenen «arbeid», i en mappe per uke. Der fortsetter jobben etter en stopp.
          # Grenen bygges ikke av Netlify, så dette koster ingen deploy.
          mkdir -p arbeid
          if [ "$FRISK_START" = true ]; then
            echo "Frisk start valgt. Lagret arbeid brukes ikke." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git fetch --quiet --depth 1 origin +refs/heads/arbeid:refs/remotes/origin/arbeid 2>/dev/null \
             && git cat-file -e "refs/remotes/origin/arbeid:$MAPPE" 2>/dev/null; then
            git archive refs/remotes/origin/arbeid "$MAPPE" | tar -x -C "$RUNNER_TEMP"
            cp -R "$RUNNER_TEMP/$MAPPE/." arbeid/
            echo "Hentet lagret arbeid ($(find arbeid -type f | wc -l) filer) fra grenen arbeid, mappe $MAPPE:" | tee -a "$GITHUB_STEP_SUMMARY"
            (cd arbeid && ls -1) | sed 's/^/- /' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Ingen lagret arbeid for $MAPPE. Starter fra begynnelsen." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lag utgaven med Claude (abonnement)
        if: steps.metode.outputs.metode == 'abonnement'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODELL: ${{ vars.NYHETER_MODELL || 'claude-opus-5-5' }}
        run: |
          # En API-nøkkel i miljøet går foran abonnementet, så den fjernes for sikkerhets skyld.
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          rm -f uke.json claude-stopp.txt
          mkdir -p arbeid
          # Claude kjører i bakgrunnen, og bruksvokteren stopper den hvis en grense nås.
          # Bash er bare åpnet for hjelpeverktøyet. Alt som ikke står i --allowedTools nektes (dontAsk).
          : > claude-logg.jsonl
          claude -p "$(cat verktoy/nyheter_prompt.md)" \
            --model "$MODELL" \
            --permission-mode dontAsk \
            --allowedTools "Read,Write,Edit,Glob,Grep,Agent,ToolSearch,WebSearch,WebFetch,Bash(python3 verktoy/nyheter_verktoy.py *)" \
            --output-format stream-json --verbose > claude-logg.jsonl &
          CPID=$!
          python3 verktoy/bruksvokter.py vokt --pid "$CPID" --logg claude-logg.jsonl --stopp claude-stopp.txt \
            --ukegrense "$UKEGRENSE" --maks-minutter "$MAKS_MINUTTER" &
          VPID=$!
          KODE=0
          wait "$CPID" || KODE=$?
          kill "$VPID" 2>/dev/null || true
          wait "$VPID" 2>/dev/null || true

          {
            echo "### Claude (abonnement), modell $MODELL"
            echo
            python3 verktoy/bruksvokter.py status --logg claude-logg.jsonl || true
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s claude-stopp.txt ]; then
            {
              echo "**Stoppet av bruksvokteren.** $(cat claude-stopp.txt)"
              echo
              echo "Arbeidet som er ferdig, er lagret på grenen arbeid. Kjør jobben på nytt når grensen er nullstilt, så fortsetter den der den slapp."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Stoppet av bruksvokteren: $(cat claude-stopp.txt)"
            exit 1
          fi

          SISTE=$(jq -c 'select(.type=="result")' claude-logg.jsonl | tail -n 1)
          if [ -z "$SISTE" ]; then
            echo "::error::Fant ingen resultat i loggen fra Claude (kode $KODE). Se claude-logg.jsonl under Artifacts."
            exit 1
          fi
          echo "$SISTE" | jq -r '.result // ""' > rapport.md
          {
            echo "Turer: $(echo "$SISTE" | jq -r '.num_turns // "?"'). Nektede verktøykall: $(echo "$SISTE" | jq -r '(.permission_denials // []) | length')."
            echo
            cat rapport.md
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$KODE" != 0 ] || [ "$(echo "$SISTE" | jq -r '.is_error')" != "false" ]; then
            echo "::error::Claude avsluttet med feil (kode $KODE). Se oppsummeringen."
            exit 1
          fi
          if [ ! -s uke.json ]; then
            echo "::error::Claude lagde ikke uke.json. Se rapporten i oppsummeringen. Står det «Stoppet av bruksgrensen», kjør jobben på nytt etter nullstilling."
            exit 1
          fi

      - name: Lag utgaven med Claude (API)
        if: steps.metode.outputs.metode == 'api'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          node verktoy/nyheter_agenter.mjs --args args.json --ut uke.json --rapport rapport.md 2>&1 | tee konsoll.txt
          cat rapport.md >> "$GITHUB_STEP_SUMMARY"

      - name: Legg inn og sjekk
        if: steps.uke.outputs.finnes != 'true' || env.OVERSKRIV == 'true'
        run: |
          python3 verktoy/nyheter_verktoy.py legg-til uke.json
          python3 verktoy/nyheter_verktoy.py sjekk
          git --no-pager diff --stat

      - name: Publiser til main
        if: (steps.uke.outputs.finnes != 'true' || env.OVERSKRIV == 'true') && env.DRY_RUN != 'true'
        run: |
          UKE=$(python3 -c "import json; a=json.load(open('args.json', encoding='utf-8-sig')); print(a['uke'], a['aar'])")
          git config user.name "NHHS AI nyhetsrobot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nyheter-data.js
          git commit -m "Nyhetsutgave uke $UKE"
          git push
          echo "Publisert: uke $UKE. Netlify bygger siden på nytt." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tørrkjøring ferdig
        if: (steps.uke.outputs.finnes != 'true' || env.OVERSKRIV == 'true') && env.DRY_RUN == 'true'
        run: |
          echo "Tørrkjøring: ingenting er publisert. Last ned «utgave» under Artifacts for å lese uke.json." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lagre arbeidsfiler på grenen arbeid
        if: always() && steps.metode.outputs.metode == 'abonnement' && hashFiles('arbeid/**') != ''
        env:
          MAPPE: ${{ steps.uke.outputs.mappe }}
        run: |
          # Lagres også når Claude ble stoppet eller feilet, slik at neste kjøring kan fortsette.
          W="$RUNNER_TEMP/arbeidsgren"
          if git fetch --quiet --depth 1 origin +refs/heads/arbeid:refs/remotes/origin/arbeid 2>/dev/null; then
            git worktree add --quiet --detach "$W" refs/remotes/origin/arbeid
          else
            git worktree add --quiet --detach "$W" HEAD
            git -C "$W" checkout --quiet --orphan arbeid
            git -C "$W" rm -rfq .
          fi
          mkdir -p "$W/$MAPPE"
          cp -R arbeid/. "$W/$MAPPE/"
          git -C "$W" add -A
          if git -C "$W" diff --cached --quiet; then
            echo "Ingen nye arbeidsfiler å lagre." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git -C "$W" -c user.name="NHHS AI nyhetsrobot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Arbeidsfiler $MAPPE"
            git -C "$W" push --quiet origin HEAD:refs/heads/arbeid
            echo "Lagret $(find arbeid -type f | wc -l) arbeidsfiler på grenen arbeid, mappe $MAPPE." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lagre resultat og logg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utgave
          path: |
            uke.json
            rapport.md
            logg.txt
            konsoll.txt
            claude-logg.jsonl
            claude-stopp.txt
            args.json
            arbeid/**
          if-no-files-found: ignore
          retention-days: 30
